[project]
name = "hindi-asr"
version = "0.1.0"
description = "Hindi / Hinglish speech recognition: whisper-small fine-tuned with LoRA on FLEURS, with evaluation and a voice-question demo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "torch>=2.4",
  "transformers>=4.46",
  "peft>=0.13",
  "jiwer>=3.0",
  "numpy",
  "soundfile",
  "librosa",
  "huggingface_hub",
  "pyarrow",
]

[project.optional-dependencies]
demo = ["gradio>=4.44"]
llm = ["anthropic", "openai"]
dev = ["pytest"]

[project.scripts]
hindi-asr = "hindi_asr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
